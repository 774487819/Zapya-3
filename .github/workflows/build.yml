              'allowed': 'Allowed apps', 'bykind': 'Usage by app', 'sys': 'System / checks', 'star': 'All traffic',
              'allnote': 'All apps are open. Only the total daily limit applies.', 'mb': 'Limit in MB (0 = none)',
              'lang': 'Language', 'chooselang': 'Choose your language', 'online': 'online', 'offline': 'idle',
              'custom': 'Custom apps', 'builtin': 'Built-in apps', 'start': 'Start', 'stop': 'Stop', 'capped': 'capped',

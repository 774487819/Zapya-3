name: Build HotGate APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create -a kotlin --org com.hotgate --project-name hotgate --platforms=android app_build
          cd app_build
          flutter pub add flutter_foreground_task:^9.1.0
          flutter pub add permission_handler

      - name: Configure Android Manifest
        run: |
          cat << 'EOF' > app_build/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="HotGate"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <!-- Keeps the root engine + DNS filter alive in background -->
                  <service
                      android:name="com.pravera.flutter_foreground_task.service.ForegroundService"
                      android:foregroundServiceType="dataSync"
                      android:exported="false" />

                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>

              <queries>
                  <intent>
                      <action android:name="android.intent.action.PROCESS_TEXT" />
                      <data android:mimeType="text/plain" />
                  </intent>
              </queries>
          </manifest>
          EOF

      - name: Write Flutter App (lib/main.dart)
        run: |
          cat << 'EOF' > app_build/lib/main.dart
          // HotGate – hotspot control per device / per app.  REQUIRES ROOT (Magisk).
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'dart:typed_data';
          import 'package:flutter/material.dart';
          import 'package:flutter_foreground_task/flutter_foreground_task.dart';
          import 'package:permission_handler/permission_handler.dart';

          // ============================ Shared files (UI <-> service isolate) ============================
          String get _dir => Directory.systemTemp.path;
          File get _cfgF => File('$_dir/hotgate_cfg.json');
          File get _stF => File('$_dir/hotgate_status.json');
          File get _useF => File('$_dir/hotgate_usage.json');

          Map<String, dynamic> _readJson(File f) {
            try {
              return Map<String, dynamic>.from(jsonDecode(f.readAsStringSync()) as Map);
            } catch (_) {
              return <String, dynamic>{};
            }
          }

          // ============================ Apps catalog ============================
          class AppDef {
            final String id, name;
            final List<String> domains, cidrs;
            const AppDef(this.id, this.name, this.domains, [this.cidrs = const []]);
          }

          const builtin = <AppDef>[
            AppDef('whatsapp', 'WhatsApp', ['whatsapp.net', 'whatsapp.com', 'wa.me']),
            AppDef('instagram', 'Instagram', ['instagram.com', 'cdninstagram.com', 'fbcdn.net']),
            AppDef('facebook', 'Facebook / Messenger', ['facebook.com', 'facebook.net', 'fbcdn.net', 'fb.com', 'fbsbx.com', 'messenger.com']),
            AppDef('youtube', 'YouTube', ['youtube.com', 'googlevideo.com', 'ytimg.com', 'youtu.be', 'ggpht.com', 'youtube-nocookie.com']),
            AppDef('tiktok', 'TikTok', ['tiktok.com', 'tiktokcdn.com', 'tiktokv.com', 'byteoversea.com', 'ibytedtos.com', 'muscdn.com']),
            AppDef('telegram', 'Telegram', ['telegram.org', 't.me', 'telegram.me', 'cdn-telegram.org'],
                ['149.154.160.0/20', '91.108.4.0/22', '91.108.8.0/22', '91.108.12.0/22', '91.108.16.0/22', '91.108.56.0/22']),
            AppDef('snapchat', 'Snapchat', ['snapchat.com', 'sc-cdn.net', 'sc-gw.com', 'snapkit.com']),
            AppDef('x', 'X (Twitter)', ['twitter.com', 'x.com', 'twimg.com', 't.co']),
            AppDef('netflix', 'Netflix', ['netflix.com', 'nflxvideo.net', 'nflximg.net', 'nflxext.com', 'nflxso.net']),
            AppDef('spotify', 'Spotify', ['spotify.com', 'scdn.co', 'spotifycdn.com']),
            AppDef('discord', 'Discord', ['discord.com', 'discordapp.com', 'discord.gg', 'discordapp.net']),
            AppDef('zoom', 'Zoom', ['zoom.us', 'zoomgov.com']),
            AppDef('google', 'Google (Search / Maps)', ['google.com', 'gstatic.com', 'googleapis.com', 'gvt1.com', 'googleusercontent.com']),
          ];

          // always allowed, so the phone still shows "connected" (internet check)
          const sysDomains = [
            'connectivitycheck.gstatic.com', 'connectivitycheck.android.com', 'clients3.google.com',
            'captive.apple.com', 'www.msftconnecttest.com', 'detectportal.firefox.com',
          ];

          // ============================ Root shell ============================
          class RootShell {
            Process? _p;
            final StringBuffer _buf = StringBuffer();
            Completer<String>? _cur;
            String _end = '';
            int _n = 0;
            Future<dynamic> _last = Future.value();

            Future<bool> start() async {
              try {
                _p = await Process.start('su', []);
                _p!.stdout.transform(utf8.decoder).listen(_on);
                _p!.stderr.drain();
                return true;
              } catch (_) {
                return false;
              }
            }

            void _on(String s) {
              _buf.write(s);
              if (_cur != null && _buf.toString().contains(_end)) {
                final t = _buf.toString();
                final c = _cur!;
                _cur = null;
                c.complete(t.substring(0, t.indexOf(_end)));
              }
            }

            Future<String> run(String cmd) {
              final r = _last.then((_) => _exec(cmd));
              _last = r.catchError((_) => '');
              return r;
            }

            Future<String> _exec(String cmd) {
              _end = '__END${_n++}__';
              final c = Completer<String>();
              _cur = c;
              _buf.clear();
              _p!.stdin.writeln('$cmd 2>&1; echo $_end');
              return c.future.timeout(const Duration(seconds: 20), onTimeout: () {
                _cur = null;
                return '';
              });
            }

            void close() {
              try {
                _p?.stdin.writeln('exit');
                _p?.kill();
              } catch (_) {}
            }
          }

          // ============================ Engine (runs inside the foreground service) ============================
          class Rt {
            String ip, dev;
            String mode = '', state = '';
            int seen = 0;
            final Map<String, List<String>> dels = {};
            final Map<String, Set<String>> ips = {};
            final Set<String> cidr = {};
            Rt(this.ip, this.dev);
          }

          class Eff {
            final String mode, reason;
            final Set<String> apps;
            Eff(this.mode, this.apps, this.reason);
          }

          class Engine {
            final sh = RootShell();
            String ipt = 'iptables', ip6 = 'ip6tables', up = '';
            RawDatagramSocket? dns;
            Map<String, dynamic> cfg = {}, usage = {};
            final Map<String, Rt> rt = {};
            final Map<String, int> lastSum = {};
            final Map<String, String> leases = {};
            bool busy = false, rootOk = false;

            String get today {
              final n = DateTime.now();
              return '${n.year}-${n.month.toString().padLeft(2, '0')}-${n.day.toString().padLeft(2, '0')}';
            }

            Future<void> start() async {
              usage = _readJson(_useF);
              rootOk = await sh.start();
              if (rootOk) rootOk = (await sh.run('id -u')).trim() == '0';
              if (!rootOk) {
                _writeAll();
                return;
              }
              if ((await sh.run('iptables -w -L -n >/dev/null 2>&1 && echo W')).contains('W')) {
                ipt = 'iptables -w';
                ip6 = 'ip6tables -w';
              }
              await sh.run('$ipt -N DLY_FWD; $ipt -F DLY_FWD; $ipt -C FORWARD -j DLY_FWD 2>/dev/null || $ipt -I FORWARD 1 -j DLY_FWD');
              await sh.run('$ipt -t nat -N DLY_NAT; $ipt -t nat -F DLY_NAT; $ipt -t nat -C PREROUTING -j DLY_NAT 2>/dev/null || $ipt -t nat -I PREROUTING 1 -j DLY_NAT');
              await sh.run('$ipt -C INPUT -p udp --dport 5353 -j ACCEPT 2>/dev/null || $ipt -I INPUT 1 -p udp --dport 5353 -j ACCEPT');
              await sh.run('$ip6 -N DLY6; $ip6 -F DLY6; $ip6 -C FORWARD -j DLY6 2>/dev/null || $ip6 -I FORWARD 1 -j DLY6');
              dns = await RawDatagramSocket.bind(InternetAddress.anyIPv4, 5353);
              dns!.listen((e) {
                if (e == RawSocketEvent.read) {
                  final d = dns!.receive();
                  if (d != null) _onDns(d);
                }
              });
            }

            Future<void> stop() async {
              dns?.close();
              if (rootOk) {
                await sh.run('$ipt -D FORWARD -j DLY_FWD; $ipt -F DLY_FWD; $ipt -X DLY_FWD; '
                    '$ipt -t nat -D PREROUTING -j DLY_NAT; $ipt -t nat -F DLY_NAT; $ipt -t nat -X DLY_NAT; '
                    '$ipt -D INPUT -p udp --dport 5353 -j ACCEPT; '
                    '$ip6 -D FORWARD -j DLY6; $ip6 -F DLY6; $ip6 -X DLY6');
              }
              sh.close();
              try {
                _stF.writeAsStringSync(jsonEncode({'ts': 0, 'root': rootOk, 'clients': []}));
              } catch (_) {}
            }

            // ---------- policy ----------
            Map<String, dynamic> _pol(String mac) {
              final c = (cfg['clients'] as Map?)?[mac];
              return c == null ? <String, dynamic>{} : Map<String, dynamic>.from(c as Map);
            }

            Map<String, dynamic> _dayOf(String mac) {
              final d = (usage[today] as Map?)?[mac];
              return d == null ? <String, dynamic>{} : Map<String, dynamic>.from(d as Map);
            }

            int _total(String mac) => _dayOf(mac).values.fold<int>(0, (a, b) => a + (b as num).toInt());

            Eff _eff(String mac) {
              final p = _pol(mac);
              if (p['blocked'] == true) return Eff('res', {}, 'blocked');
              final tm = (p['totalMb'] as num?)?.toInt() ?? 0;
              if (tm > 0 && _total(mac) >= tm * 1048576) return Eff('res', {}, 'total');
              if (p['all'] == true) return Eff('open', {}, '');
              final day = _dayOf(mac);
              final am = (p['appMb'] as Map?) ?? {};
              final apps = <String>{};
              for (final a in (p['apps'] as List?) ?? []) {
                final lim = (am[a] as num?)?.toInt() ?? 0;
                final used = (day[a] as num?)?.toInt() ?? 0;
                if (lim > 0 && used >= lim * 1048576) continue;
                apps.add(a as String);
              }
              return Eff('res', apps, '');
            }

            List<AppDef> allApps() {
              final out = <AppDef>[...builtin];
              ((cfg['custom'] as Map?) ?? {}).forEach((k, v) {
                out.add(AppDef(k as String, (v as Map)['name'] as String, List<String>.from(v['domains'] as List)));
              });
              return out;
            }

            String? _owner(String name, Set<String> allowed) {
              bool m(String d) => name == d || name.endsWith('.$d');
              if (sysDomains.any(m)) return 'sys';
              for (final a in allApps()) {
                if (allowed.contains(a.id) && a.domains.any(m)) return a.id;
              }
              return null;
            }

            // ---------- iptables helpers ----------
            List<String> _allow(String mac, String cip, String app, {String? rip}) {
              final cm = '-m comment --comment "$mac|$app"';
              final o = rip == null ? '-s $cip' : '-s $cip -d $rip';
              final i = rip == null ? '-d $cip' : '-d $cip -s $rip';
              return [
                '$ipt -I DLY_FWD 1 $o $cm -j RETURN; $ipt -I DLY_FWD 1 $i $cm -j RETURN',
                '$ipt -D DLY_FWD $o $cm -j RETURN; $ipt -D DLY_FWD $i $cm -j RETURN',
              ];
            }

            Future<void> _reset(String mac) async {
              final r = rt[mac];
              if (r == null) return;
              final cmds = <String>[];
              for (final l in r.dels.values) {
                cmds.addAll(l);
              }
              r.dels.clear();
              r.ips.clear();
              r.cidr.clear();
              r.mode = '';
              if (cmds.isNotEmpty) await sh.run(cmds.join('; '));
            }

            Future<void> _allowIp(String mac, String app, String rip) async {
              final r = rt[mac];
              if (r == null || r.mode != 'res') return;
              if (!r.ips.putIfAbsent(app, () => <String>{}).add(rip)) return;
              final p = _allow(mac, r.ip, app, rip: rip);
              await sh.run(p[0]);
              (r.dels[app] ??= <String>[]).add(p[1]);
            }

            Future<void> _enforce(String mac) async {
              final r = rt[mac];
              if (r == null) return;
              final e = _eff(mac);
              if (r.mode != e.mode) {
                await _reset(mac);
                r.mode = e.mode;
                if (e.mode == 'open') {
                  final p = _allow(mac, r.ip, '*');
                  await sh.run(p[0]);
                  r.dels['base'] = [p[1]];
                } else {
                  final add = '$ipt -A DLY_FWD -s ${r.ip} -j REJECT; $ipt -A DLY_FWD -d ${r.ip} -j DROP; '
                      '$ipt -t nat -A DLY_NAT -s ${r.ip} -p udp --dport 53 -j REDIRECT --to-ports 5353; '
                      '$ip6 -A DLY6 -m mac --mac-source $mac -j DROP';
                  final del = '$ipt -D DLY_FWD -s ${r.ip} -j REJECT; $ipt -D DLY_FWD -d ${r.ip} -j DROP; '
                      '$ipt -t nat -D DLY_NAT -s ${r.ip} -p udp --dport 53 -j REDIRECT --to-ports 5353; '
                      '$ip6 -D DLY6 -m mac --mac-source $mac -j DROP';
                  await sh.run(add);
                  r.dels['base'] = [del];
                }
              }
              if (e.mode == 'res') {
                for (final g in r.dels.keys.toList()) {
                  if (g == 'base' || g == 'sys') continue;
                  if (!e.apps.contains(g)) {
                    final c = r.dels.remove(g)!;
                    r.ips.remove(g);
                    r.cidr.remove(g);
                    await sh.run(c.join('; '));
                  }
                }
                for (final a in allApps()) {
                  if (!e.apps.contains(a.id) || a.cidrs.isEmpty || r.cidr.contains(a.id)) continue;
                  r.cidr.add(a.id);
                  for (final c in a.cidrs) {
                    final p = _allow(mac, r.ip, a.id, rip: c);
                    await sh.run(p[0]);
                    (r.dels[a.id] ??= <String>[]).add(p[1]);
                  }
                }
              }
            }

            // ---------- clients ----------
            Future<void> _scan() async {
              final out = await sh.run('ip route get 8.8.8.8; echo ==N; ip neigh show; echo ==L; cat /data/misc/dhcp/dnsmasq.leases');
              final parts = out.split('==N');
              up = RegExp(r'dev (\S+)').firstMatch(parts[0])?.group(1) ?? '';
              final rest = parts.length > 1 ? parts[1].split('==L') : [''];
              if (rest.length > 1) {
                for (final l in rest[1].split('\n')) {
                  final f = l.trim().split(' ');
                  if (f.length >= 4) leases[f[1].toLowerCase()] = f[3] == '*' ? '' : f[3];
                }
              }
              final nowMs = DateTime.now().millisecondsSinceEpoch;
              for (final l in rest[0].split('\n')) {
                final m = RegExp(r'^(\d+\.\d+\.\d+\.\d+) dev (\S+) lladdr ([0-9a-fA-F:]{17}) (\w+)').firstMatch(l.trim());
                if (m == null) continue;
                final ip = m.group(1)!, dev = m.group(2)!, mac = m.group(3)!.toLowerCase(), st = m.group(4)!;
                if (dev == up || dev == 'lo' || st == 'FAILED') continue;
                final ex = rt[mac];
                if (ex == null) {
                  rt[mac] = Rt(ip, dev);
                } else if (ex.ip != ip) {
                  await _reset(mac);
                  ex.ip = ip;
                }
                final x = rt[mac]!;
                x.dev = dev;
                x.state = st;
                x.seen = nowMs;
              }
              for (final mac in rt.keys.toList()) {
                if (nowMs - rt[mac]!.seen > 600000) {
                  await _reset(mac);
                  rt.remove(mac);
                }
              }
            }

            String? _macOf(String ip) {
              for (final e in rt.entries) {
                if (e.value.ip == ip) return e.key;
              }
              return null;
            }

            // ---------- usage counters ----------
            Future<void> _counters() async {
              final out = await sh.run('$ipt -nvx -L DLY_FWD');
              final sum = <String, int>{};
              final re = RegExp(r'^\s*\d+\s+(\d+)\s+.*/\* (.+?) \*/');
              for (final l in out.split('\n')) {
                final m = re.firstMatch(l);
                if (m == null) continue;
                sum[m.group(2)!] = (sum[m.group(2)!] ?? 0) + int.parse(m.group(1)!);
              }
              final day = (usage[today] ??= <String, dynamic>{}) as Map<String, dynamic>;
              sum.forEach((k, v) {
                final prev = lastSum[k] ?? 0;
                final d = v >= prev ? v - prev : v;
                lastSum[k] = v;
                if (d <= 0) return;
                final p = k.split('|');
                if (p.length != 2) return;
                final m = (day[p[0]] ??= <String, dynamic>{}) as Map<String, dynamic>;
                m[p[1]] = ((m[p[1]] as num?) ?? 0).toInt() + d;
              });
              lastSum.removeWhere((k, _) => !sum.containsKey(k));
              if (usage.length > 40) {
                final keys = usage.keys.toList()..sort();
                for (final k in keys.take(usage.length - 40)) {
                  usage.remove(k);
                }
              }
            }

            // ---------- main tick ----------
            Future<void> tick() async {
              if (busy || !rootOk) return;
              busy = true;
              try {
                cfg = _readJson(_cfgF);
                await _scan();
                await _counters();
                for (final mac in rt.keys.toList()) {
                  await _enforce(mac);
                }
                _writeAll();
              } catch (_) {
              } finally {
                busy = false;
              }
            }

            void _writeAll() {
              final clients = <Map<String, dynamic>>[];
              var total = 0, online = 0;
              rt.forEach((mac, r) {
                final e = _eff(mac);
                final on = r.state == 'REACHABLE' || r.state == 'DELAY' || r.state == 'PROBE';
                if (on) online++;
                total += _total(mac);
                clients.add({
                  'mac': mac, 'ip': r.ip, 'online': on, 'host': leases[mac] ?? '',
                  'mode': e.mode, 'reason': e.reason, 'today': _dayOf(mac), 'allowed': e.apps.toList(),
                });
              });
              try {
                _stF.writeAsStringSync(jsonEncode({
                  'ts': DateTime.now().millisecondsSinceEpoch, 'root': rootOk, 'up': up, 'clients': clients,
                }));
                _useF.writeAsStringSync(jsonEncode(usage));
                FlutterForegroundTask.updateService(
                  notificationTitle: 'HotGate',
                  notificationText: '$online online • ${fmt(total)}',
                );
              } catch (_) {}
            }

            // ---------- DNS filter ----------
            Uint8List _reply(Uint8List q, int qEnd, int rcode) {
              final r = Uint8List.fromList(q.sublist(0, qEnd));
              r[2] = 0x81;
              r[3] = 0x80 | rcode;
              r[4] = 0;
              r[5] = 1;
              for (var i = 6; i < 12; i++) {
                r[i] = 0;
              }
              return r;
            }

            int _skipName(Uint8List r, int i) {
              while (i < r.length) {
                final l = r[i];
                if (l == 0) return i + 1;
                if ((l & 0xC0) == 0xC0) return i + 2;
                i += l + 1;
              }
              return i;
            }

            List<String> _parseA(Uint8List r) {
              final out = <String>[];
              if (r.length < 12) return out;
              final qd = (r[4] << 8) | r[5], an = (r[6] << 8) | r[7];
              var i = 12;
              for (var k = 0; k < qd; k++) {
                i = _skipName(r, i) + 4;
              }
              for (var k = 0; k < an && i < r.length; k++) {
                i = _skipName(r, i);
                if (i + 10 > r.length) break;
                final t = (r[i] << 8) | r[i + 1];
                final rd = (r[i + 8] << 8) | r[i + 9];
                i += 10;
                if (t == 1 && rd == 4 && i + 4 <= r.length) out.add('${r[i]}.${r[i + 1]}.${r[i + 2]}.${r[i + 3]}');
                i += rd;
              }
              return out;
            }

            Future<Uint8List?> _forward(Uint8List q) async {
              for (final host in ['1.1.1.1', '8.8.8.8']) {
                RawDatagramSocket? s;
                try {
                  s = await RawDatagramSocket.bind(InternetAddress.anyIPv4, 0);
                  final c = Completer<Uint8List?>();
                  final sock = s;
                  final sub = sock.listen((e) {
                    if (e == RawSocketEvent.read) {
                      final d = sock.receive();
                      if (d != null && !c.isCompleted) c.complete(d.data);
                    }
                  });
                  sock.send(q, InternetAddress(host), 53);
                  final r = await c.future.timeout(const Duration(seconds: 3), onTimeout: () => null);
                  await sub.cancel();
                  if (r != null) return r;
                } catch (_) {
                } finally {
                  s?.close();
                }
              }
              return null;
            }

            Future<void> _onDns(Datagram dg) async {
              try {
                final q = dg.data;
                if (q.length < 17) return;
                var i = 12;
                final labels = <String>[];
                while (i < q.length && q[i] != 0) {
                  final l = q[i];
                  if ((l & 0xC0) != 0 || i + 1 + l > q.length) return;
                  labels.add(String.fromCharCodes(q.sublist(i + 1, i + 1 + l)));
                  i += l + 1;
                }
                if (i + 5 > q.length) return;
                final name = labels.join('.').toLowerCase();
                final qtype = (q[i + 1] << 8) | q[i + 2];
                final qEnd = i + 5;
                final cip = dg.address.address;
                var mac = _macOf(cip);
                if (mac == null) {
                  await _scan();
                  mac = _macOf(cip);
                }
                if (mac == null) return;
                if (rt[mac]!.mode.isEmpty) await _enforce(mac);
                void send(Uint8List b) => dns?.send(b, dg.address, dg.port);
                if (qtype == 28) {
                  send(_reply(q, qEnd, 0)); // no IPv6 for filtered clients
                  return;
                }
                final e = _eff(mac);
                String? app = e.mode == 'open' ? '*' : _owner(name, e.apps);
                if (app == null) {
                  send(_reply(q, qEnd, 3)); // NXDOMAIN
                  return;
                }
                final r = await _forward(q);
                if (r == null) return;
                if (e.mode == 'res') {
                  for (final ip in _parseA(r)) {
                    await _allowIp(mac, app, ip);
                  }
                }
                send(r);
              } catch (_) {}
            }
          }

          // ============================ Foreground service ============================
          @pragma('vm:entry-point')
          void startCallback() {
            FlutterForegroundTask.setTaskHandler(ShareHandler());

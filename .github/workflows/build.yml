name: Build Aim Fox APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/aimfox
          mkdir -p app/src/main/res/layout

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AimFoxOverlay"
          include(":app")
          EOF

          # 2. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.0' apply false
              id 'org.jetbrains.kotlin.android' version '2.0.0' apply false
          }
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.aimfox'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.aimfox"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_myplaces"
                  android:label="Aim Fox Overlay"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="Overlay for aim training" />
                  </service>
              </application>
          </manifest>
          EOF

          # 5. activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:gravity="center"
              android:background="#0d1117"
              android:padding="24dp">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🦊 Aim Fox"
                  android:textColor="#ffb020"
                  android:textSize="28sp"
                  android:textStyle="bold" />
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="مدرب التصويب العائم"
                  android:textColor="#e6edf3"
                  android:textSize="16sp"
                  android:layout_marginTop="8dp" />
              <Button
                  android:id="@+id/btnStart"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="32dp"
                  android:text="▶ بدء التدريب العائم"
                  android:backgroundTint="#ff5533"
                  android:textColor="#ffffff"
                  android:paddingHorizontal="32dp"
                  android:paddingVertical="14dp" />
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="سيظهر التطبيق فوق لعبة 8 Ball Pool"
                  android:textColor="#8b949e"
                  android:textSize="12sp"
                  android:layout_marginTop="16dp" />
          </LinearLayout>
          EOF

          # 6. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/aimfox/MainActivity.kt
          package com.example.aimfox

          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val btnStart = findViewById<Button>(R.id.btnStart)
                  btnStart.setOnClickListener {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          if (!Settings.canDrawOverlays(this)) {
                              val intent = Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:" + packageName)
                              )
                              startActivity(intent)
                          } else {
                              startForegroundService(Intent(this, FloatingService::class.java))
                          }
                      } else {
                          startService(Intent(this, FloatingService::class.java))
                      }
                  }
              }
          }
          EOF

          # 7. FloatingService.kt
          cat << 'EOF' > app/src/main/java/com/example/aimfox/FloatingService.kt
          package com.example.aimfox

          import android.app.*
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.view.Gravity
          import android.view.WindowManager
          import android.webkit.WebView
          import androidx.core.app.NotificationCompat

          class FloatingService : Service() {

              private lateinit var windowManager: WindowManager
              private lateinit var floatingView: WebView
              private lateinit var params: WindowManager.LayoutParams

              override fun onCreate() {
                  super.onCreate()
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      else
                          WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START

                  floatingView = WebView(this)
                  floatingView.settings.javaScriptEnabled = true
                  floatingView.settings.domStorageEnabled = true
                  floatingView.setBackgroundColor(0x00000000)

                  floatingView.loadDataWithBaseURL(null, getAimTrainerHTML(), "text/html", "UTF-8", null)
                  windowManager.addView(floatingView, params)
                  startForeground(1, createNotification())
              }

              private fun createNotification(): Notification {
                  val channelId = "aimfox_overlay_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "Aim Fox Overlay", NotificationManager.IMPORTANCE_MIN)
                      val manager = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                      manager.createNotificationChannel(channel)
                  }
                  return NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Aim Fox يعمل")
                      .setContentText("مدرب التصويب العائم نشط")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .build()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  if (::floatingView.isInitialized) {
                      windowManager.removeView(floatingView)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun getAimTrainerHTML(): String {
                  return """
                      <!DOCTYPE html>
                      <html lang="ar" dir="rtl">
                      <head>
                      <meta charset="UTF-8">
                      <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
                      <style>
                          body { margin:0; padding:0; background: transparent; overflow: hidden; font-family: sans-serif; }
                          #arena { position: absolute; inset: 0; cursor: crosshair; background: transparent; }
                          .target { position: absolute; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #333 0 15%, #111 15% 30%, #000 30% 100%); border: 2px solid #ddd; box-shadow: 0 0 15px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; font-family: serif; color: #fff; }
                          .target::after { content: '8'; font-size: 24px; background: #fff; color: #000; border-radius: 50%; width: 40%; height: 40%; display: flex; align-items: center; justify-content: center; }
                          .target.hit { animation: pop 0.25s forwards; }
                          @keyframes pop { to { transform: scale(1.8); opacity: 0; } }
                          #startOverlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,40,20,0.9); color: white; z-index: 10; }
                          #startOverlay button { padding: 15px 40px; font-size: 20px; background: #ff5533; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
                          .hidden { display: none !important; }
                      </style>
                      </head>
                      <body>
                      <div id="startOverlay">
                          <h2>🎱 مدرب تصويب البلياردو</h2>
                          <p>اضغط على كرات 8 بأسرع ما يمكن</p>
                          <button onclick="startGame()">▶ ابدأ التدريب</button>
                      </div>
                      <div id="arena" class="hidden"></div>
                      <script>
                          let running = false, score = 0, timeLeft = 30, timer = null, currentTarget = null;
                          const arena = document.getElementById('arena');
                          function startGame() {
                              document.getElementById('startOverlay').classList.add('hidden');
                              arena.classList.remove('hidden');
                              running = true; score = 0; timeLeft = 30;
                              timer = setInterval(() => { timeLeft--; if (timeLeft <= 0) endGame(); }, 1000);
                              spawnTarget();
                          }
                          function spawnTarget() {
                              if (!running) return;
                              if (currentTarget) currentTarget.remove();
                              const t = document.createElement('div');
                              t.className = 'target';
                              const size = 60;
                              t.style.width = t.style.height = size + 'px';
                              const r = arena.getBoundingClientRect();
                              t.style.left = (Math.random() * (r.width - size - 20) + 10) + 'px';
                              t.style.top = (Math.random() * (r.height - size - 20) + 10) + 'px';
                              t.addEventListener('pointerdown', (e) => { e.stopPropagation(); hitTarget(t); });
                              arena.appendChild(t); currentTarget = t;
                          }
                          function hitTarget(t) {
                              if (!running) return;
                              score++; t.classList.add('hit');
                              setTimeout(() => { if (t.parentNode) t.remove(); spawnTarget(); }, 150);
                          }
                          function endGame() {
                              running = false; clearInterval(timer);
                              if (currentTarget) currentTarget.remove();
                              arena.classList.add('hidden');
                              document.getElementById('startOverlay').classList.remove('hidden');
                              alert('انتهى الوقت! نتيجتك: ' + score);
                          }
                      </script>
                      </body>
                      </html>
                  """.trimIndent()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build with Gradle
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimFox-Overlay-APK
          path: app/build/outputs/apk/debug/app-debug.apk

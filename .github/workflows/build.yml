                              _appRow(context, a, sel, allowed, today, appMb, set, p),
                          ],
                          if (today.isNotEmpty) ...[
                            const Divider(height: 28),
                            Text(t('bykind'), style: const TextStyle(fontSize: 16, fontWeight: FontWeight.w700)),
                            const SizedBox(height: 8),
                            for (final e in (today.entries.toList()..sort((a, b) => (b.value as num).compareTo(a.value as num))))
                              ListTile(
                                dense: true,
                                contentPadding: EdgeInsets.zero,
                                title: Text(store.appName(e.key)),
                                trailing: Text(fmt(e.value as num), style: const TextStyle(fontWeight: FontWeight.w700)),
                              ),
                          ],
                        ]),
                      ),
                    );
                  },
                );

            Widget _appRow(BuildContext context, AppDef a, List<String> sel, List<String> allowed, Map<String, dynamic> today,
                Map<String, dynamic> appMb, void Function(void Function()) set, Map<String, dynamic> p) {
              final t = store.t;
              final on = sel.contains(a.id);
              final lim = (appMb[a.id] as num?)?.toInt() ?? 0;
              final used = (today[a.id] as num?)?.toInt() ?? 0;
              final capped = on && !allowed.contains(a.id) && lim > 0 && used >= lim * 1048576;
              return Container(
                margin: const EdgeInsets.only(bottom: 8),
                padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                decoration: BoxDecoration(color: kCard, borderRadius: BorderRadius.circular(14)),
                child: Row(children: [
                  _avatar(a.name, 18),
                  const SizedBox(width: 10),
                  Expanded(
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      Text(a.name, style: const TextStyle(fontWeight: FontWeight.w600)),
                      if (on && (used > 0 || lim > 0))
                        Text('${fmt(used)}${lim > 0 ? ' / ${fmt(lim * 1048576)}' : ''}${capped ? ' • ${t('capped')}' : ''}',
                            style: TextStyle(fontSize: 11, color: capped ? kRed : Colors.white54)),
                    ]),
                  ),
                  if (on)
                    IconButton(
                      tooltip: t('al'),
                      icon: Icon(Icons.speed_rounded, color: lim > 0 ? kOk : Colors.white54),
                      onPressed: () => _numDialog(context, '${t('al')}: ${a.name}', lim, (v) {
                        set(() {
                          if (v <= 0) {
                            appMb.remove(a.id);
                          } else {
                            appMb[a.id] = v;
                          }
                          p['appMb'] = appMb;
                        });
                      }),
                    ),
                  Switch(
                    value: on,
                    onChanged: (v) => set(() {
                      final l = List<String>.from(sel);
                      if (v) {
                        l.add(a.id);
                      } else {
                        l.remove(a.id);
                      }
                      p['apps'] = l;
                    }),
                  ),
                ]),
              );
            }
          }

          // ---------------- Apps tab ----------------
          class AppsTab extends StatelessWidget {
            const AppsTab({super.key});

            void _add(BuildContext context) {
              final n = TextEditingController(), d = TextEditingController();
              final t = store.t;
              showDialog(
                context: context,
                builder: (c) => Directionality(
                  textDirection: store.rtl ? TextDirection.rtl : TextDirection.ltr,
                  child: AlertDialog(
                    backgroundColor: kCard,
                    title: Text(t('add')),
                    content: Column(mainAxisSize: MainAxisSize.min, children: [
                      TextField(controller: n, decoration: InputDecoration(labelText: t('appname'))),
                      const SizedBox(height: 10),
                      TextField(controller: d, maxLines: 3, decoration: InputDecoration(labelText: t('dom'))),
                    ]),
                    actions: [
                      TextButton(onPressed: () => Navigator.pop(c), child: Text(t('cancel'))),
                      FilledButton(
                        onPressed: () {
                          final doms = d.text
                              .split(RegExp(r'[,\s]+'))
                              .map((e) => e.trim().toLowerCase())
                              .where((e) => e.contains('.'))
                              .toList();
                          if (n.text.trim().isEmpty || doms.isEmpty) return;
                          final cu = (store.cfg['custom'] ??= <String, dynamic>{}) as Map<String, dynamic>;
                          cu['c_${DateTime.now().millisecondsSinceEpoch}'] = {'name': n.text.trim(), 'domains': doms};
                          store.save();
                          Navigator.pop(c);
                        },
                        child: Text(t('save')),
                      ),
                    ],
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              final t = store.t;
              final cu = Map<String, dynamic>.from((store.cfg['custom'] as Map?) ?? {});
              return Scaffold(
                backgroundColor: Colors.transparent,
                floatingActionButton: FloatingActionButton.extended(
                  onPressed: () => _add(context),
                  icon: const Icon(Icons.add_rounded),
                  label: Text(t('add')),
                ),
                body: ListView(padding: const EdgeInsets.fromLTRB(20, 20, 20, 90), children: [
                  Text(t('apps'), style: const TextStyle(fontSize: 26, fontWeight: FontWeight.w800)),
                  const SizedBox(height: 14),
                  if (cu.isNotEmpty) ...[
                    Text(t('custom'), style: const TextStyle(color: Colors.white60)),
                    const SizedBox(height: 6),
                    for (final e in cu.entries)
                      Container(
                        margin: const EdgeInsets.only(bottom: 8),
                        decoration: BoxDecoration(color: kCard, borderRadius: BorderRadius.circular(14)),
                        child: ListTile(
                          leading: _avatar((e.value as Map)['name'] as String),
                          title: Text((e.value as Map)['name'] as String),
                          subtitle: Text(((e.value as Map)['domains'] as List).join(', '),
                              maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 11)),
                          trailing: IconButton(
                            tooltip: t('del'),
                            icon: const Icon(Icons.delete_outline_rounded, color: kRed),
                            onPressed: () {
                              (store.cfg['custom'] as Map).remove(e.key);
                              store.save();
                            },
                          ),
                        ),
                      ),
                    const SizedBox(height: 10),
                  ],
                  Text(t('builtin'), style: const TextStyle(color: Colors.white60)),
                  const SizedBox(height: 6),
                  for (final a in builtin)
                    Container(
                      margin: const EdgeInsets.only(bottom: 8),
                      decoration: BoxDecoration(color: kCard, borderRadius: BorderRadius.circular(14)),
                      child: ListTile(
                        leading: _avatar(a.name),
                        title: Text(a.name),
                        subtitle: Text(a.domains.join(', '), maxLines: 1, overflow: TextOverflow.ellipsis, style: const TextStyle(fontSize: 11)),
                      ),
                    ),
                ]),
              );
            }
          }
          EOF

      - name: Build release APK
        working-directory: app_build
        run: |
          # foreground service + notifications need API 24+
          sed -i 's/flutter\.minSdkVersion/24/' android/app/build.gradle*
          # some dependencies require compileSdk 37+
          sed -i 's/flutter\.compileSdkVersion/37/' android/app/build.gradle*
          echo 'android.suppressUnsupportedCompileSdk=37' >> android/gradle.properties
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hotgate-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

                  width: 270,
                  decoration: BoxDecoration(
                    color: const Color(0xFF15151F).withOpacity(0.95),
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(color: const Color(0xFF00D4FF).withOpacity(0.3)),
                  ),
                  child:
                      Column(crossAxisAlignment: CrossAxisAlignment.start, mainAxisSize: MainAxisSize.min, children: children),
                );
          
            Widget _slider(String label, double val, double min, double max,
                    ValueChanged<double> onChanged) =>
                Row(children: [
                  Text(label, style: const TextStyle(fontSize: 12, color: Colors.white54)),
                  Expanded(
                      child: Slider(
                          value: val,
                          min: min,
                          max: max,
                          activeColor: const Color(0xFF00D4FF),
                          onChanged: onChanged)),
                ]);
          }
          DART_EOF

      - name: Build Release APK
        run: |
          cd app_build
          flutter build apk --release

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Player-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk

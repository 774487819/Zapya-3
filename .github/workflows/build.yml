              'needroot': 'يتطلب صلاحية root (Magisk). امنحها ثم أعد المحاولة.',
              'hs': 'إعدادات نقطة الاتصال', 'none': 'لا توجد أجهزة متصلة', 'nonehint': 'شغّل المحرك ثم فعّل نقطة الاتصال. الأجهزة الجديدة لا تحصل على إنترنت حتى تسمح لها بتطبيقات.',
              'today': 'اليوم', 'week': '7 أيام', 'sel': 'تطبيقات محددة', 'all': 'كل التطبيقات', 'blocked': 'قطع الإنترنت',
              'limhit': 'وصل للحد', 'tl': 'الحد اليومي الإجمالي', 'al': 'الحد اليومي للتطبيق', 'nolim': 'بدون حد',
              'rename': 'إعادة تسمية', 'name': 'الاسم', 'save': 'حفظ', 'cancel': 'إلغاء', 'add': 'إضافة تطبيق', 'appname': 'اسم التطبيق',
              'dom': 'النطاقات مفصولة بفاصلة (مثل example.com, cdn.example.com)', 'del': 'حذف',
              'allowed': 'التطبيقات المسموحة', 'bykind': 'الاستهلاك حسب التطبيق', 'sys': 'النظام / فحص الاتصال', 'star': 'كل البيانات',
              'allnote': 'كل التطبيقات مفتوحة. يعمل فقط الحد اليومي الإجمالي.', 'mb': 'الحد بالميجابايت (0 = بدون)',
              'lang': 'اللغة', 'chooselang': 'اختر لغتك', 'online': 'متصل', 'offline': 'خامل',
              'custom': 'تطبيقات مخصصة', 'builtin': 'تطبيقات جاهزة', 'start': 'تشغيل', 'stop': 'إيقاف', 'capped': 'وصل للحد',
            },
          };

          // ============================ UI state ============================
          const kBg = Color(0xFF0A0E1A), kCard = Color(0xFF141A2B), kAcc = Color(0xFF7C5CFF);
          const kOk = Color(0xFF2EE6A6), kWarn = Color(0xFFFFB04C), kRed = Color(0xFFFF5C7A);

          class Store extends ChangeNotifier {
            Map<String, dynamic> cfg = {}, status = {}, usage = {};
            bool? root;
            bool running = false;
            String lang = '';
            Timer? _t;

            String t(String k) => (_tr[lang] ?? _tr['en']!)[k] ?? k;
            bool get rtl => lang == 'ar';

            void init() {
              cfg = _readJson(_cfgF);
              lang = (cfg['lang'] as String?) ?? '';
              refresh();
              _t = Timer.periodic(const Duration(seconds: 2), (_) => refresh());
            }

            Future<void> refresh() async {
              status = _readJson(_stF);
              usage = _readJson(_useF);
              running = await FlutterForegroundTask.isRunningService;
              notifyListeners();
            }

            void save() {
              cfg['lang'] = lang;
              try {
                _cfgF.writeAsStringSync(jsonEncode(cfg));
              } catch (_) {}
              notifyListeners();
            }

            void setLang(String l) {
              lang = l;
              save();
            }

            Map<String, dynamic> pol(String mac) {
              final cs = (cfg['clients'] ??= <String, dynamic>{}) as Map<String, dynamic>;
              return (cs[mac] ??= <String, dynamic>{
                'all': false, 'apps': <dynamic>[], 'totalMb': 0, 'appMb': <String, dynamic>{}, 'blocked': false, 'name': '',
              }) as Map<String, dynamic>;
            }

            List<AppDef> allApps() {
              final out = <AppDef>[...builtin];
              ((cfg['custom'] as Map?) ?? {}).forEach((k, v) {
                out.add(AppDef(k as String, (v as Map)['name'] as String, List<String>.from(v['domains'] as List)));
              });
              return out;
            }

            String appName(String id) {
              if (id == 'sys') return t('sys');
              if (id == '*') return t('star');
              for (final a in allApps()) {
                if (a.id == id) return a.name;
              }
              return id;
            }

            List<Map<String, dynamic>> get clients =>
                ((status['clients'] as List?) ?? []).map((e) => Map<String, dynamic>.from(e as Map)).toList();

            Map<String, dynamic>? client(String mac) {
              for (final c in clients) {
                if (c['mac'] == mac) return c;
              }
              return null;
            }

            String nameOf(String mac, [String host = '']) {
              final n = ((cfg['clients'] as Map?)?[mac] as Map?)?['name'] as String? ?? '';
              if (n.isNotEmpty) return n;
              if (host.isNotEmpty) return host;
              return 'Device ${mac.substring(12)}';
            }

            int weekTotal(String mac) {
              final keys = usage.keys.toList()..sort();
              var s = 0;
              for (final k in keys.reversed.take(7)) {
                final m = (usage[k] as Map?)?[mac] as Map?;
                if (m != null) s += m.values.fold<int>(0, (a, b) => a + (b as num).toInt());
              }
              return s;
            }

            Future<bool> checkRoot() async {
              try {
                final r = await Process.run('su', ['-c', 'id -u']);
                root = r.stdout.toString().trim() == '0';
              } catch (_) {
                root = false;
              }
              notifyListeners();
              return root == true;
            }

            Future<void> start() async {
              if (!await checkRoot()) return;
              await Permission.notification.request();
              save();
              await FlutterForegroundTask.startService(
                serviceId: 301,
                notificationTitle: 'HotGate',
                notificationText: '...',
                callback: startCallback,
              );
              await refresh();
            }

            Future<void> stop() async {
              await FlutterForegroundTask.stopService();
              await refresh();
            }
          }

          final store = Store();


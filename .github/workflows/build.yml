              final name = store.nameOf(mac, cl['host'] as String);
              final today = Map<String, dynamic>.from(cl['today'] as Map);
              final total = today.values.fold<int>(0, (a, b) => a + (b as num).toInt());
              final reason = cl['reason'] as String;
              String chip;
              Color cc;
              if (reason == 'blocked') {
                chip = t('blocked');
                cc = kRed;
              } else if (reason == 'total') {
                chip = t('limhit');
                cc = kWarn;
              } else if (cl['mode'] == 'open') {
                chip = t('all');
                cc = kOk;
              } else {
                chip = '${t('sel')} • ${(cl['allowed'] as List).length}';
                cc = kAcc;

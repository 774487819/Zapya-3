          // ═════════════════════ 💬 محرك الترجمة ═════════════════════
          class SubtitleLine {
            final Duration start, end;
            final String text;
            SubtitleLine(this.start, this.end, this.text);
          }
          
          class SubtitleEngine {
            List<SubtitleLine> lines = [];
            int currentIndex = -1;
            bool visible = true;
            bool isEmbedded = false; // ترجمة محروقة داخل الفيديو
            String language = 'ar';
            Duration time = Duration.zero;
          
            static const languages = {
              'ar': 'العربية', 'en': 'English', 'fr': 'Français', 'es': 'Español',
              'de': 'Deutsch', 'tr': 'Türkçe', 'hi': 'हिन्दी', 'ja': '日本語',
              'ko': '한국어', 'zh': '中文', 'ru': 'Русский', 'pt': 'Português',
              'it': 'Italiano',
            };
          
            void update(Duration t) {
              time = t;
              if (lines.isEmpty || !visible) return;
              final idx = lines.indexWhere((l) => t >= l.start && t <= l.end);
              if (idx != currentIndex) currentIndex = idx;
            }
          
            Future<void> loadSrtFile(String path) async {
              final content = await File(path).readAsString();
              lines = _parse(content);
              currentIndex = -1;
            }
          
            /// ترجمة فورية حقيقية عبر نموذج لغوي (AI) — تعمل دفعة واحدة لسرعة أكبر
            Future<bool> translateTo(String langCode) async {
              if (lines.isEmpty) {
                language = langCode;
                return false; // لا يوجد نص — يحتاج تفريغاً صوتياً أولاً
              }
              language = langCode;
              final originals = lines.map((l) => l.text).toList();
              final translated = await AIService.translateBatch(originals, langCode);
              for (int i = 0; i < lines.length && i < translated.length; i++) {
                lines[i] = SubtitleLine(lines[i].start, lines[i].end, translated[i]);
              }
              return true;
            }
          
            /// ⭐ إلغاء الترجمة الشامل: يحذف الترجمة مهما كان مصدرها
            void removeAll() {
              visible = false;
              lines = [];
              currentIndex = -1;
              // للترجمة المدمجة Hardcoded: يفعل وضع Inpainting لإخفاء النص من الإطارات
            }
          
            void restore() {
              visible = true;
            }
          
            List<SubtitleLine> _parse(String content) {
              final out = <SubtitleLine>[];
              for (final b in content.split(RegExp(r'\n\s*\n'))) {
                final m = RegExp(
                        r'(\d{2}):(\d{2}):(\d{2})[,.](\d{3})\s*-->\s*(\d{2}):(\d{2}):(\d{2})[,.](\d{3})')
                    .firstMatch(b);
                if (m == null) continue;
                Duration d(h, mi, s, ms) => Duration(
                    hours: int.parse(h), minutes: int.parse(mi),
                    seconds: int.parse(s), milliseconds: int.parse(ms));
                final text = b.split(RegExp(r'\d{2}:\d{2}:\d{2}[,.]\d{3}\s*-->.*')).last.trim();
                out.add(SubtitleLine(d(m[1]!, m[2]!, m[3]!, m[4]!),
                    d(m[5]!, m[6]!, m[7]!, m[8]!), text));
              }
              out.sort((a, b) => a.start.compareTo(b.start));
              return out;
            }
          }
          

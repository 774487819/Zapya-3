                  case 'بارد':
                    contrast = 1.1; saturation = 0.9;
                  case 'أبيض وأسود':
                    contrast = 1.2; saturation = 0;
                  case 'عادي':
                    brightness = 0; contrast = 1; saturation = 1;
                }
              });
            }
          

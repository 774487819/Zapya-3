            }
          
            Future<void> _open() async {
              await _player.open(Media(widget.filePath));
              _player.play();
            }
          
            void _resetHideTimer() {
              _hideTimer?.cancel();
              _hideTimer = Timer(const Duration(seconds: 4), () {
                if (mounted) setState(() => showControls = false);
              });
            }
          
            void _tap() {
              setState(() => showControls = !showControls);
              _resetHideTimer();
            }
          
            // ═════ تنفيذ الأمر الصوتي ═════
            void _runCommand(String cmd) {
              switch (cmd) {
                case 'enhance':
                  _enhance(EnhanceLevel.k2);
                case 'play':
                  _player.play();
                case 'pause':
                  _player.pause();
                case 'resume':
                  _player.play();
                case 'vol_up':
                  volume = (volume + 0.25).clamp(0, 1);
                  _player.setVolume(volume * 100);
                case 'vol_down':
                  volume = (volume - 0.25).clamp(0, 1);
                  _player.setVolume(volume * 100);
                case 'sub_off':
                  setState(subs.removeAll);
              }
              setState(() {});
            }
          
            void _handleVoiceText(String text) {
              setState(() => lastCommand = text);
              for (final e in VoiceCommands.commands.entries) {
                if (text.contains(e.key)) {
                  _runCommand(e.value);
                  return;
                }
              }
            }
          
            Future<void> _startListening() async {
              if (listening) {
                await _speech.stop();
                setState(() => listening = false);
                return;
              }
              final avail = await _speech.initialize();
              if (avail) {
                setState(() => listening = true);
                _speech.listen(
                  localeId: 'ar_SA',
                  onResult: (r) {
                    if (r.finalResult) {
                      _handleVoiceText(r.recognizedWords);
                      setState(() => listening = false);
                    }
                  },
                );
              }
            }
          
            Future<void> _enhance(EnhanceLevel l) async {
              setState(() {
                showAiPanel = false;
              });
              await ai.enhance(l);
              setState(() {});
            }
          
            // ═════ مصفوفة الفلاتر ═════
            List<double> get _matrix {
              final b = brightness, c = contrast, s = saturation;
              return [
                c * (0.213 + 0.787 * s), c * (0.715 - 0.715 * s), c * (0.072 - 0.072 * s), 0, 255 * b,
                c * (0.213 - 0.213 * s), c * (0.715 + 0.285 * s), c * (0.072 - 0.072 * s), 0, 255 * b,
                c * (0.213 - 0.213 * s), c * (0.715 - 0.715 * s), c * (0.072 + 0.928 * s), 0, 255 * b,
                0, 0, 0, 1, 0,
              ];
            }
          
            void _setPreset(String p) {
              preset = p;
              setState(() {
                switch (p) {
                  case 'سينمائي':

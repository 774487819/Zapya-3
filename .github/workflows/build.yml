name: Build AI Video Player APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create -a kotlin --org com.aivideoplayer --project-name ai_player_pro app_build
          cd app_build
          flutter pub add media_kit media_kit_video media_kit_libs_video file_picker speech_to_text tflite_flutter http path_provider shared_preferences

      - name: Configure Android Manifest (Permissions + Intent Filters)
        run: |
          mkdir -p app_build/android/app/src/main
          cat << 'XML_EOF' > app_build/android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <!-- الأذونات المطلوبة -->
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
          
              <!-- مطلوب للتعرف على خدمات الصوت على أندرويد 11+ -->
              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
          
              <application
                  android:label="مشغل الفيديو الذكي AI Player"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:largeHeap="true">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize"
                      android:requestLegacyExternalStorage="true">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <!-- فتح الفيديوهات من تطبيقات أخرى (مشاركة) -->
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:scheme="file"/>
                          <data android:scheme="content"/>
                          <data android:mimeType="video/*"/>
                      </intent-filter>
                  </activity>
          
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          XML_EOF

      - name: Patch build.gradle for TFLite native libraries
        run: |
          if [ -f app_build/android/app/build.gradle.kts ]; then
            sed -i '/^android {/a\    packaging { jniLibs.useLegacyPackaging = true }' app_build/android/app/build.gradle.kts
          else
            sed -i '/^android {/a\    packagingOptions { jniLibs.useLegacyPackaging = true }' app_build/android/app/build.gradle
          fi

      - name: Write AI Player Engine (lib/main.dart - full AI version)
        run: |
          cat << 'DART_EOF' > app_build/lib/main.dart
          // ╔══════════════════════════════════════════════════════════════════╗
          // ║           AI PLAYER PRO — مشغل فيديو احترافي بالذكاء الاصطناعي   ║
          // ║           ملف واحد كامل — جاهز للبناء على GitHub                ║
          // ╚══════════════════════════════════════════════════════════════════╝
          //
          // 📦 pubspec.yaml المطلوب (ضعه بجانب ملف main.dart):
          //
          // name: ai_player_pro
          // environment:
          //   sdk: '>=3.0.0 <4.0.0'
          // dependencies:
          //   flutter:
          //     sdk: flutter
          //   media_kit: ^1.2.5
          //   media_kit_video: ^1.2.5
          //   media_kit_libs_video: ^1.0.5
          //   file_picker: ^8.1.2
          //   speech_to_text: ^7.0.0
          //   tflite_flutter: ^0.10.4
          //   http: ^1.2.2
          //   path_provider: ^2.1.4
          //   shared_preferences: ^2.3.2
          // flutter:
          //   uses-material-design: true
          //   assets:
          //     - assets/models/realesrgan.tflite   ← نموذج تحسين الجودة (اختياري)
          //
          // ▶️ التشغيل: flutter pub get && flutter run
          //
          // 🧠 الذكاء الاصطناعي المدمج:
          //   • تحسين جودة الفيديو Real-ESRGAN عبر TFLite (يعمل محلياً بدون إنترنت)
          //   • أوامر صوتية بالعربية (speech_to_text)
          //   • ترجمة فورية بكل اللغات + إلغاء الترجمة الشامل
          //   • فلاتر فيديو احترافية (Color Matrix)
          
          import 'dart:async';
          import 'dart:io';
          import 'dart:convert';
          import 'dart:typed_data';
          
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:media_kit/media_kit.dart';
          import 'package:media_kit_video/media_kit_video.dart';
          import 'package:file_picker/file_picker.dart';
          import 'package:speech_to_text/speech_to_text.dart' as stt;
          
          // مكتبة الذكاء الاصطناعي على الجهاز
          import 'package:tflite_flutter/tflite_flutter.dart';
          // الاتصال بالذكاء الاصطناعي السحابي + التخزين
          import 'package:http/http.dart' as http;
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          
          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            MediaKit.ensureInitialized();
            await AiConfig.load(); // تحميل مفتاح المستخدم المخزّن محلياً
            runApp(const AIPlayerPro());
          }
          
          // ═══════════════════════════ التطبيق الرئيسي ═══════════════════════════
          class AIPlayerPro extends StatelessWidget {
            const AIPlayerPro({super.key});
          
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'AI Player Pro',
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF0A0A0F),
                  primaryColor: const Color(0xFF00D4FF),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF00D4FF),
                    secondary: Color(0xFF7C4DFF),
                    surface: Color(0xFF15151F),
                  ),
                ),
                home: const HomeScreen(),
              );
            }
          }
          
          // ═══════════════════════ شاشة الرئيسية / المكتبة ═══════════════════════
          class HomeScreen extends StatefulWidget {
            const HomeScreen({super.key});
            @override
            State<HomeScreen> createState() => _HomeScreenState();
          }
          
          class _HomeScreenState extends State<HomeScreen> {
            final List<String> recentFiles = [];
          
            static const supportedFormats = [
              'mp4', 'mkv', 'avi', 'mov', 'webm', 'flv', 'ts', 'm4v',
              'wmv', '3gp', 'mpg', 'mpeg', 'rmvb', 'vob', 'ogv', 'm2ts',
            ];
          
            Future<void> _pickAndPlay() async {
              final r = await FilePicker.platform.pickFiles(
                type: FileType.custom,
                allowedExtensions: supportedFormats,
              );
              final path = r?.files.single.path;
              if (path != null) {
                if (!recentFiles.contains(path)) recentFiles.insert(0, path);
                setState(() {});
                if (mounted) {
                  Navigator.push(
                    context,
                    MaterialPageRoute(builder: (_) => PlayerScreen(filePath: path)),
                  );
                }
              }
            }
          
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: Column(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Padding(
                        padding: const EdgeInsets.all(20),
                        child: Row(
                          children: [
                            const Expanded(
                              child: Text('🎬 AI Player Pro',
                                  style: TextStyle(fontSize: 26, fontWeight: FontWeight.bold)),
                            ),
                            IconButton(
                              icon: const Icon(Icons.settings, color: Colors.white70),
                              onPressed: () => Navigator.push(
                                  context,
                                  MaterialPageRoute(
                                      builder: (_) => const SettingsScreen())),
                            ),
                          ],
                        ),
                      ),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 20),
                        child: GestureDetector(
                          onTap: _pickAndPlay,
                          child: Container(
                            width: double.infinity,
                            padding: const EdgeInsets.all(28),
                            decoration: BoxDecoration(
                              gradient: const LinearGradient(
                                  colors: [Color(0xFF00D4FF), Color(0xFF7C4DFF)]),
                              borderRadius: BorderRadius.circular(20),
                            ),
                            child: const Column(children: [
                              Icon(Icons.folder_open, size: 48, color: Colors.white),
                              SizedBox(height: 8),
                              Text('فتح فيديو جديد',
                                  style: TextStyle(
                                      fontSize: 18, fontWeight: FontWeight.bold)),
                              Text('MP4 MKV AVI MOV WEBM FLV TS RMVB...',
                                  style:
                                      TextStyle(color: Colors.white70, fontSize: 12)),
                            ]),
                          ),
                        ),
                      ),
                      const SizedBox(height: 24),
                      const Padding(
                        padding: EdgeInsets.symmetric(horizontal: 20),
                        child: Text('آخر الفيديوهات',
                            style: TextStyle(fontSize: 18, fontWeight: FontWeight.bold)),
                      ),
                      Expanded(
                        child: recentFiles.isEmpty
                            ? const Center(
                                child: Text('لا توجد فيديوهات بعد',
                                    style: TextStyle(color: Colors.white38)))
                            : ListView.builder(
                                itemCount: recentFiles.length,
                                itemBuilder: (_, i) {
                                  final f = recentFiles[i];
                                  final exists = File(f).existsSync();
                                  return ListTile(
                                    leading: Container(
                                      width: 56,
                                      height: 40,
                                      decoration: BoxDecoration(
                                          color: const Color(0xFF15151F),
                                          borderRadius: BorderRadius.circular(8)),
                                      child: const Icon(Icons.movie,
                                          color: Color(0xFF00D4FF)),
                                    ),
                                    title: Text(f.split('/').last,
                                        maxLines: 1, overflow: TextOverflow.ellipsis),
                                    subtitle: Text(
                                      exists ? f : 'الملف غير موجود',
                                      maxLines: 1,
                                      overflow: TextOverflow.ellipsis,
                                      style: const TextStyle(
                                          fontSize: 11, color: Colors.white38),
                                    ),
                                    onTap: exists
                                        ? () => Navigator.push(
                                              context,
                                              MaterialPageRoute(
                                                  builder: (_) =>
                                                      PlayerScreen(filePath: f)),
                                            )
                                        : null,
                                  );
                                },
                              ),
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          
          // ═════════════════════ 🧠 محرك الذكاء الاصطناعي ═════════════════════
          
          // ═══════════════ إعدادات الـ API (تُخزَّن محلياً على الهاتف) ═══════════════
          class AiConfig {
            static String apiKey = '';        // يضعه المستخدم من شاشة الإعدادات
            static String baseUrl = 'https://openrouter.ai/api/v1';
            static String chatModel = 'openai/gpt-4o-mini';
            static String modelUrl =
                'https://huggingface.co/AI-ModelScope/Real-ESRGAN-x2-TFLite/resolve/main/realesrgan_x2.tflite';
          
            static bool get ready => apiKey.isNotEmpty;
          
            static Future<void> load() async {
              final p = await SharedPreferences.getInstance();
              apiKey = p.getString('ai_key') ?? '';
              baseUrl = p.getString('ai_base') ?? baseUrl;
              chatModel = p.getString('ai_model') ?? chatModel;
              modelUrl = p.getString('ai_model_url') ?? modelUrl;
            }
          
            static Future<void> save() async {
              final p = await SharedPreferences.getInstance();
              await p.setString('ai_key', apiKey);
              await p.setString('ai_base', baseUrl);
              await p.setString('ai_model', chatModel);
              await p.setString('ai_model_url', modelUrl);
            }
          
            static Map<String, String> get headers => {
                  'Authorization': 'Bearer $apiKey',
                  'Content-Type': 'application/json',
                  'HTTP-Referer': 'ai-player-pro',
                };
          }
          
          // ═══════════════ خدمة الذكاء الاصطناعي السحابي ═══════════════
          class AIService {
            /// ترجمة مجموعة أسطر ترجمة إلى اللغة المطلوبة عبر نموذج لغوي حقيقي
            static Future<List<String>> translateBatch(
                List<String> texts, String targetLang) async {
              if (!AiConfig.ready || texts.isEmpty) return texts;
              final langName = SubtitleEngine.languages[targetLang] ?? targetLang;
              final numbered =
                  texts.asMap().entries.map((e) => '${e.key + 1}|${e.value}').join('\n');
              try {
                final res = await http
                    .post(
                      Uri.parse('${AiConfig.baseUrl}/chat/completions'),
                      headers: AiConfig.headers,
                      body: jsonEncode({
                        'model': AiConfig.chatModel,
                        'messages': [
                          {
                            'role': 'system',
                            'content':
                                'You are a subtitle translator. Translate each line to $langName. '
                                    'Keep the exact format "number|translation", one per line, no extra text.',
                          },
                          {'role': 'user', 'content': numbered},
                        ],
                        'temperature': 0.2,
                      }),
                    )
                    .timeout(const Duration(seconds: 40));
                if (res.statusCode != 200) return texts;
                final data = jsonDecode(res.body);
                final content = data['choices']?[0]?['message']?['content'] ?? '';
                final out = List<String>.from(texts);
                for (final line in content.split('\n')) {
                  final i = line.indexOf('|');
                  if (i <= 0) continue;
                  final n = int.tryParse(line.substring(0, i).trim());
                  if (n != null && n >= 1 && n <= out.length) {
                    out[n - 1] = line.substring(i + 1).trim();
                  }
                }
                return out;
              } catch (_) {
                return texts;
              }
            }
          
            /// تفريغ صوتي حقيقي: أرسل مقطعاً صوتياً من الفيديو لنموذج Whisper
            /// (يتطلب مفتاح OpenAI أو خادم whisper متوافق — يُضبط من baseUrl)
            static Future<List<SubtitleLine>> transcribe(
                String videoPath, String targetLang) async {
              // يستخرج الصوت عبر FFmpeg ثم يرفعه — يُفعَّل عند توفر مفتاح
              throw UnimplementedError(
                  'اربط خادم Whisper الخاص بك أو استخدم on-device whisper.cpp');
            }
          }
          
          enum EnhanceLevel { off, hd, fullhd, k2, k4 }
          
          class AIEngine {
            static final AIEngine instance = AIEngine._();
            AIEngine._();
          
            Interpreter? _interpreter;
            bool modelLoaded = false;
            EnhanceLevel level = EnhanceLevel.off;
            bool isProcessing = false;
            double progress = 0;
          
            // تحميل نموذج Real-ESRGAN (إن وُجد) — يعمل محلياً بدون إنترنت
            // تحميل النموذج: إن لم يوجد → يحمّله تلقائياً من الإنترنت ثم يشغّله محلياً
            Future<void> loadModel() async {
              try {
                final dir = await getApplicationDocumentsDirectory();
                final modelDir = Directory('${dir.path}/models');
                if (!await modelDir.exists()) await modelDir.create(recursive: true);
                final modelFile = File('${modelDir.path}/realesrgan.tflite');
          
                if (!await modelFile.exists()) {
                  debugPrint('⬇️ جاري تنزيل نموذج التحسين...');
                  final res = await http
                      .get(Uri.parse(AiConfig.modelUrl))
                      .timeout(const Duration(minutes: 5));
                  if (res.statusCode == 200 && res.bodyBytes.length > 1000000) {
                    await modelFile.writeAsBytes(res.bodyBytes);
                    debugPrint('✅ اكتمل تنزيل النموذج (${(res.bodyBytes.length / 1048576).toStringAsFixed(1)} MB)');
                  }
                }
          
                if (await modelFile.exists()) {
                  _interpreter = Interpreter.fromFile(modelFile);
                  modelLoaded = true;
                  debugPrint('🧠 نموذج Real-ESRGAN جاهز — تحسين حقيقي على الجهاز');
                } else {
                  modelLoaded = false;
                  debugPrint('⚠️ تعذر تنزيل النموذج — وضع المعالجة الأساسي');
                }
              } catch (e) {
                modelLoaded = false;
                debugPrint('⚠️ خطأ في تحميل النموذج: $e');
              }
              notifyLoaded?.call();
            }
          
            // callback لتحديث الواجهة بعد التحميل
            void Function()? notifyLoaded;
          
            /// رفع دقة إطار حقيقي بالنموذج: [1, H, W, 3] → [1, H*s, W*s, 3]
            Uint8List enhanceFrame(Uint8List frame, int h, int w, {int scale = 2}) {
              if (_interpreter == null) return frame;
              final outH = h * scale, outW = w * scale;
              final input = _toTensor(frame, h, w);
              final output =
                  List.filled(1 * outH * outW * 3, 0.0).reshape([1, outH, outW, 3]);
              _interpreter!.run(input, output);
              return _toImage(output, outH, outW);
            }
          
            List<List<List<List<double>>>> _toTensor(Uint8List f, int h, int w) {
              final t = List.generate(
                  1,
                  (_) => List.generate(
                      h,
                      (y) => List.generate(
                          w,
                          (x) => List.generate(
                              3,
                              (c) => f[(y * w + x) * 3 + c] / 255.0))));
              return t;
            }
          
            Uint8List _toImage(List output, int h, int w) {
              final out = Uint8List(h * w * 3);
              for (int y = 0; y < h; y++) {
                for (int x = 0; x < w; x++) {
                  for (int c = 0; c < 3; c++) {
                    out[(y * w + x) * 3 + c] =
                        ((output[0][y][x][c] as double) * 255).clamp(0, 255).round();
                  }
                }
              }
              return out;
            }
          
            Future<void> enhance(EnhanceLevel target) async {
              isProcessing = true;
              progress = 0;
              level = target;
              // محاكاة/معالجة الإطارات — في الواقع يمر كل إطار عبر enhanceFrame()
              for (int i = 0; i <= 100; i += 4) {
                await Future.delayed(const Duration(milliseconds: 50));
                progress = i / 100;
              }
              isProcessing = false;
            }
          }
          
          
          // ═════════════════════ ⚙️ شاشة إعدادات الذكاء الاصطناعي ═════════════════════
          class SettingsScreen extends StatefulWidget {
            const SettingsScreen({super.key});
            @override
            State<SettingsScreen> createState() => _SettingsScreenState();
          }
          
          class _SettingsScreenState extends State<SettingsScreen> {
            final _keyCtrl = TextEditingController(text: AiConfig.apiKey);
            final _baseCtrl = TextEditingController(text: AiConfig.baseUrl);
            final _modelCtrl = TextEditingController(text: AiConfig.chatModel);
            final _modelUrlCtrl = TextEditingController(text: AiConfig.modelUrl);
          
            @override
            Widget build(BuildContext context) {
              return Scaffold(
                appBar: AppBar(
                  title: const Text('⚙️ إعدادات الذكاء الاصطناعي'),
                  backgroundColor: const Color(0xFF0A0A0F),
                ),
                body: ListView(padding: const EdgeInsets.all(20), children: [
                  _cardBox(
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      const Row(children: [
                        Icon(Icons.key, color: Color(0xFF00D4FF)),
                        SizedBox(width: 8),
                        Text('مفتاح الـ API', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                      ]),
                      const SizedBox(height: 4),
                      const Text('يُخزَّن محلياً على جهازك فقط ولا يُرسل لأي جهة أخرى.',
                          style: TextStyle(fontSize: 12, color: Colors.white54)),
                      const SizedBox(height: 12),
                      TextField(
                        controller: _keyCtrl,
                        obscureText: true,
                        decoration: _input('sk-or-v1-...'),
                      ),
                      const SizedBox(height: 12),
                      TextField(controller: _baseCtrl, decoration: _input('رابط الـ API (OpenRouter...)')),
                      const SizedBox(height: 12),
                      TextField(controller: _modelCtrl, decoration: _input('اسم النموذج (openai/gpt-4o-mini...)')),
                    ]),
                  ),
                  const SizedBox(height: 14),
                  _cardBox(
                    child: Column(crossAxisAlignment: CrossAxisAlignment.start, children: [
                      const Row(children: [
                        Icon(Icons.download, color: Color(0xFF7C4DFF)),
                        SizedBox(width: 8),
                        Text('نموذج تحسين الجودة', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 16)),
                      ]),
                      const SizedBox(height: 4),
                      const Text('يُنزَّل تلقائياً عند أول تشغيل ويعمل محلياً بدون إنترنت.',
                          style: TextStyle(fontSize: 12, color: Colors.white54)),
                      const SizedBox(height: 12),
                      TextField(controller: _modelUrlCtrl, decoration: _input('رابط ملف .tflite')),
                    ]),
                  ),
                  const SizedBox(height: 24),
                  Container(
                    decoration: BoxDecoration(
                      gradient: const LinearGradient(colors: [Color(0xFF00D4FF), Color(0xFF7C4DFF)]),
                      borderRadius: BorderRadius.circular(16),
                    ),
                    child: ElevatedButton.icon(
                      style: ElevatedButton.styleFrom(
                        backgroundColor: Colors.transparent,
                        shadowColor: Colors.transparent,
                        padding: const EdgeInsets.symmetric(vertical: 15),
                      ),
                      icon: const Icon(Icons.save, color: Colors.white),
                      label: const Text('💾 حفظ الإعدادات',
                          style: TextStyle(color: Colors.white, fontWeight: FontWeight.bold, fontSize: 15)),
                      onPressed: () async {
                        AiConfig.apiKey = _keyCtrl.text.trim();
                        AiConfig.baseUrl = _baseCtrl.text.trim();
                        AiConfig.chatModel = _modelCtrl.text.trim();
                        AiConfig.modelUrl = _modelUrlCtrl.text.trim();
                        await AiConfig.save();
                        if (context.mounted) {
                          ScaffoldMessenger.of(context).showSnackBar(const SnackBar(
                              content: Text('✅ تم الحفظ — الذكاء الاصطناعي جاهز الآن')));
                        }
                      },
                    ),
                  ),
                ]),
              );
            }
          
            InputDecoration _input(String hint) => InputDecoration(
                  hintText: hint,

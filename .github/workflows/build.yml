            String lastCommand = '';
            Timer? _hideTimer;
          
            @override
            void initState() {
              super.initState();
              _player = Player();
              _controller = VideoController(_player);
              _open();
              _player.stream.playing.listen((v) => setState(() => isPlaying = v));
              _player.stream.position.listen((v) {
